
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql

  back:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - ENV_FILE=.env.local
      - SECRET_KEY_BASE=dummy_secret_key_for_development_1234567890abcdef
    command: bundle exec rails s -p 3000 -b '0.0.0.0'
    ports:
      - "3000:3000"
    depends_on:
      - db
    tty: true
    stdin_open: true
    volumes:
      - ./backend:/app

volumes:
  db-data: